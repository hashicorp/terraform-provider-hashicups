services:
  minio:
    image: "minio/minio:latest"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: 'minioadmin'
      MINIO_ROOT_PASSWORD: 'minioadminpassword'
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - minio_data:/data
    networks:
      - registry-net
  
  minio-create-bucket:
    image: "minio/mc:latest"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        set -e;
        mc alias set myminio http://minio:9000 minioadmin minioadminpassword &&
        mc mb myminio/pvt-registry --ignore-existing;
      "
    networks:
      - registry-net

  pvt-registry:
    image: ghcr.io/boring-registry/boring-registry:latest
    container_name: pvt-registry
    environment:
      - BORING_REGISTRY_STORAGE_S3_REGION=eu-east-1
      - BORING_REGISTRY_STORAGE_S3_BUCKET=pvt-registry
      - BORING_REGISTRY_STORAGE_S3_ENDPOINT=http://minio:9000
      - BORING_REGISTRY_STORAGE_S3_PATHSTYLE=true
      - BORING_REGISTRY_AUTH_STATIC_TOKEN=very-secure-token
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadminpassword
      - BORING_REGISTRY_DEBUG=true
    extra_hosts:
      - "minio:host-gateway"
    depends_on:
      minio-create-bucket:
        condition: service_completed_successfully
    volumes:
      - ../certs:/certs
    networks:
      - registry-net

  nginx:
    image: nginx:alpine
    ports:
      - "5601:443"
    volumes:
      - ./local-nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs:/etc/nginx/certs:ro
    extra_hosts:
      - "minio:host-gateway"
    depends_on:
      - pvt-registry
    networks:
      - registry-net

volumes:
  minio_data:

networks:
  registry-net: